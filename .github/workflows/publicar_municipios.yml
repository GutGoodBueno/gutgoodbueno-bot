name: Serie 88 municipios de Canarias

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC (18:00 en Canarias en invierno, 19:00 en verano)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serie-municipios
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Publicar el municipio del día
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python publicar_municipios.py
